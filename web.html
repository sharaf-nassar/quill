<!DOCTYPE html>
<!-- Static rather than set from `web-main.tsx`: the page-level layout below
     depends on it, and an attribute applied after hydration would flash. -->
<html lang="en" data-view="web">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" />
    <title>Quill</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web-main.tsx"></script>
  </body>
</html>
